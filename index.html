    <script>
      // Restore the requested path before the app loads.
      (function () {
        var l = window.location;
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", decoded + l.hash);
        } else if (/^#\//.test(l.hash)) {
          window.history.replaceState(null, "", "/" + l.hash.slice(2));
        }
      })();
    </script>
